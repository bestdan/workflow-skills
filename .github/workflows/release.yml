name: Release

# Auto-version-bump on merge to main, driven by Conventional Commits, so plugin
# consumers never sit behind a stale version after meaningful changes land.
#
#   feat:          -> minor      fix: / perf:     -> patch
#   BREAKING / `!` -> major      chore/docs/ci/... -> no release
#
# scripts/bump-version.py owns the version + changelog math (run it locally with
# `just bump-preview`); this workflow only commits, tags, and publishes.
#
# Loop safety: the release commit is pushed with a fine-grained PAT (RELEASE_TOKEN)
# because main is protected, and PAT pushes DO re-trigger workflows -- so the loop
# is broken by the `[skip ci]` in the release commit (honored regardless of token),
# backstopped by the `if:` guard below, which is matched tightly to the exact
# commit this workflow generates so it never skips a human commit that merely
# starts with "chore: release".
#
# Concurrency: runs are serialized (never cancelled) so a release is never
# interrupted between `git push` and `gh release create`. Each run checks out the
# tip of main and rebases just before pushing, so a queued run releases whatever
# is newest and the next run cleanly no-ops -- no non-fast-forward.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version bump + release
    runs-on: ubuntu-latest
    if: "${{ !(startsWith(github.event.head_commit.message, 'chore: release v') && contains(github.event.head_commit.message, '[skip ci]')) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # release against the tip of main, not just the pushed SHA
          fetch-depth: 0 # full history + tags: the bump diffs against the last v* tag
          fetch-tags: true
          # main is protected, and the built-in GITHUB_TOKEN can't be on a bypass
          # list -- so the release commit is pushed with a fine-grained PAT whose
          # owner is on the branch bypass list. See CONTRIBUTING.md "Versioning".
          # Its pushes re-trigger workflows, hence the [skip ci] + `if:` guards.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute + apply version bump
        id: bump
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python3 scripts/bump-version.py --apply

      - name: Install format tools
        if: ${{ steps.bump.outputs.bumped == 'true' }}
        # SHA-pinned, unlike ci.yml's floating @v4: this job runs with
        # `contents: write` and the checkout above persists RELEASE_TOKEN into
        # .git/config, so a moved tag here would execute third-party code
        # alongside a credential that can push to protected main. The CI job has
        # no such credential, hence no pin there. Bump this alongside ci.yml.
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      - name: Format generated files
        if: ${{ steps.bump.outputs.bumped == 'true' }}
        # Keep the bump dprint-clean so the next PR's CI gate stays green.
        # Must be the same dprint the gate runs, hence mise.toml rather than a
        # second pin here — dprint's markdown rules do change between minors,
        # so a release formatted by a different version lands already-dirty.
        run: dprint fmt CHANGELOG.md .claude-plugin/plugin.json .claude-plugin/marketplace.json

      - name: Commit, tag, push, and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.bump.outputs.bumped }}" = "true" ]; then
            TAG="v${{ steps.bump.outputs.new_version }}"
            git add CHANGELOG.md .claude-plugin/plugin.json .claude-plugin/marketplace.json
            git commit -m "chore: release ${TAG} [skip ci]"
            # Land on top of whatever is newest on main (a non-release push could
            # have arrived mid-run); the release commit only touches generated
            # files, so this rebase is conflict-free in practice. Tag after the
            # rebase so the tag points at the final commit, then push both.
            git fetch origin main
            git rebase origin/main
            git tag -a "${TAG}" -m "${TAG}"
            git push origin HEAD:main
            git push origin "${TAG}"
            gh release create "${TAG}" --title "${TAG}" --notes-file "${RELEASE_NOTES_FILE}"
            echo "Released ${TAG}"
          else
            # No release-worthy changes. On the very first run there is no v* tag
            # yet, so seed a baseline at the current version -- future merges then
            # have a boundary to diff against.
            TAG="v${{ steps.bump.outputs.new_version }}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "No release-worthy changes; nothing to do."
            else
              git tag -a "${TAG}" -m "baseline ${TAG}"
              git push origin "${TAG}"
              echo "Seeded baseline ${TAG}"
            fi
          fi
