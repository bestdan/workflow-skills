name: Release

# Auto-version-bump on merge to main, driven by Conventional Commits, so plugin
# consumers never sit behind a stale version after meaningful changes land.
#
#   feat:          -> minor      fix: / perf:     -> patch
#   BREAKING / `!` -> major      chore/docs/ci/... -> no release
#
# scripts/bump-version.py owns the version + changelog math (run it locally with
# `just bump-preview`); this workflow only commits, tags, and publishes.
#
# Loop safety: the release commit is pushed with a fine-grained PAT (RELEASE_TOKEN)
# because main is protected, and PAT pushes DO re-trigger workflows -- so the loop
# is broken by the `[skip ci]` in the release commit (honored regardless of token),
# backstopped by the `if:` guard below, which is matched tightly to the exact
# commit this workflow generates so it never skips a human commit that merely
# starts with "chore: release".
#
# Concurrency: runs are serialized (never cancelled) so a release is never
# interrupted between `git push` and `gh release create`. Each run checks out the
# tip of main and rebases just before pushing, so a queued run releases whatever
# is newest and the next run cleanly no-ops -- no non-fast-forward.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version bump + release
    runs-on: ubuntu-latest
    if: "${{ !(startsWith(github.event.head_commit.message, 'chore: release v') && contains(github.event.head_commit.message, '[skip ci]')) }}"
    steps:
      # SHA-pinned for the same reason mise-action is below: this job is
      # `contents: write`, and this step is handed RELEASE_TOKEN -- a PAT on
      # main's branch-protection bypass list, so strictly more valuable than the
      # job's GITHUB_TOKEN. A moved v7 tag would hand that PAT to whatever the
      # tag now points at. checkout is first-party, so the risk is lower than for
      # third-party actions, but the pin is free. ci.yml/evals.yml are
      # `contents: read` and keep the floating major.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # release against the tip of main, not just the pushed SHA
          fetch-depth: 0 # full history + tags: the bump diffs against the last v* tag
          fetch-tags: true
          # main is protected, and the built-in GITHUB_TOKEN can't be on a bypass
          # list -- so the release commit is pushed with a fine-grained PAT whose
          # owner is on the branch bypass list. See CONTRIBUTING.md "Versioning".
          # Its pushes re-trigger workflows, hence the [skip ci] + `if:` guards.
          token: ${{ secrets.RELEASE_TOKEN }}
          # Keep the PAT out of .git/config. Steps below this one run
          # third-party code (mise-action, the mise binary, and the dprint
          # binary mise installs) and a persisted credential would be readable
          # by any of them. The repo is public so the later `git fetch` needs
          # no auth; only the two pushes do, and the final step re-injects the
          # token for itself. Rotating this is manual, so containment matters
          # more than it would for a job-scoped GITHUB_TOKEN.
          persist-credentials: false

      - name: Compute + apply version bump
        id: bump
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python3 scripts/bump-version.py --apply

      - name: Install format tools
        if: ${{ steps.bump.outputs.bumped == 'true' }}
        # SHA-pinned, unlike ci.yml's floating @v4: this job runs with
        # `contents: write`, and mise-action's github_token input defaults to
        # the job's GITHUB_TOKEN, so a moved tag would hand third-party code a
        # write-scoped token. That token can't touch protected main and dies
        # with the job -- and persist-credentials: false above keeps the far
        # more valuable RELEASE_TOKEN out of reach entirely -- but the pin is
        # free, so take it. The CI job is contents: read, hence no pin there.
        # Bump this alongside ci.yml.
        #
        # The pin does not cover what mise then installs: dprint and friends
        # come from the aqua registry (see the ci.yml note on that trust root)
        # and run in this same job.
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      - name: Format generated files
        if: ${{ steps.bump.outputs.bumped == 'true' }}
        # Keep the bump dprint-clean so the next PR's CI gate stays green.
        # Must be the same dprint the gate runs, hence mise.toml rather than a
        # second pin here — dprint's markdown rules do change between minors,
        # so a release formatted by a different version lands already-dirty.
        run: dprint fmt CHANGELOG.md .claude-plugin/plugin.json .claude-plugin/marketplace.json

      - name: Commit, tag, push, and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The checkout ran with persist-credentials: false, so re-supply the
          # PAT here -- the last step in the job, after all third-party code.
          # Same extraheader mechanism actions/checkout uses internally, rather
          # than a credential in the remote URL: an in-URL token would land in
          # the argv of every later git call and in remote error output.
          #
          # `tr -d '\n'` is load-bearing twice over. GNU base64 wraps at 76
          # columns, and a 98-char PAT encodes past that -- a wrapped value both
          # breaks the header and stops matching the log mask that checkout
          # registered for the identical unwrapped string (it calls setSecret on
          # the encoded credential whenever a token is supplied, independent of
          # persist-credentials, and masks are job-scoped). That inherited mask
          # is why no ::add-mask:: is needed here -- but it is coupled to the
          # checkout above still passing token: secrets.RELEASE_TOKEN.
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${RELEASE_TOKEN}" | base64 | tr -d '\n')"

          if [ "${{ steps.bump.outputs.bumped }}" = "true" ]; then
            TAG="v${{ steps.bump.outputs.new_version }}"
            git add CHANGELOG.md .claude-plugin/plugin.json .claude-plugin/marketplace.json
            git commit -m "chore: release ${TAG} [skip ci]"
            # Land on top of whatever is newest on main (a non-release push could
            # have arrived mid-run); the release commit only touches generated
            # files, so this rebase is conflict-free in practice. Tag after the
            # rebase so the tag points at the final commit, then push both.
            git fetch origin main
            git rebase origin/main
            git tag -a "${TAG}" -m "${TAG}"
            git push origin HEAD:main
            git push origin "${TAG}"
            gh release create "${TAG}" --title "${TAG}" --notes-file "${RELEASE_NOTES_FILE}"
            echo "Released ${TAG}"
          else
            # No release-worthy changes. On the very first run there is no v* tag
            # yet, so seed a baseline at the current version -- future merges then
            # have a boundary to diff against.
            TAG="v${{ steps.bump.outputs.new_version }}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "No release-worthy changes; nothing to do."
            else
              git tag -a "${TAG}" -m "baseline ${TAG}"
              git push origin "${TAG}"
              echo "Seeded baseline ${TAG}"
            fi
          fi
