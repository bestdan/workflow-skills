name: macOS seatbelt probe

# THROWAWAY. Delete this file before the branch merges.
#
# Round 1 (run 31872616800) already answered the load-bearing question: on
# macos-latest the orchestrator suite passes under SO_TEST_REQUIRE_SEATBELT=1,
# which by that flag's own contract means ZERO seatbelt-behavioral assertions
# were skipped. A macOS runner can apply a profile, so a macOS job would deliver
# coverage that ubuntu-latest structurally cannot.
#
# Round 2 (this file) collects the remaining host facts only. The suite steps
# are gone: re-running 2x68s to re-learn something already recorded would be
# waste, and the facts below are what the recommendation still hangs on —
# specifically WHICH bash a macOS runner resolves. 31 of 35 scripts use
# `#!/usr/bin/env bash` and the Bash 3.2 floor in AGENTS.md has no mechanized
# check anywhere in the repo, so whether a macOS job would exercise that floor
# is currently an assumption, not an observation.
#
# Writes to $GITHUB_STEP_SUMMARY as well as stdout: the round-1 log ran to
# ~1100 lines and the interesting six were unreadable behind the suite output.

on:
  push:
    branches: [claude/conditional-macos-ci-s61q8e]

permissions:
  contents: read

jobs:
  facts:
    name: macOS runner host facts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Host facts
        run: |
          {
            echo '## macOS runner host facts'
            echo
            echo '```'
            echo "image        : $ImageOS / $ImageVersion"
            echo "macOS        : $(sw_vers -productVersion)"
            echo "arch         : $(uname -m)"
            echo
            # The whole point of round 2. `env bash` is what every script here
            # actually gets; /bin/bash is the 3.2 floor AGENTS.md writes about.
            # If these differ, a macOS CI job does NOT exercise that floor.
            echo "env bash     : $(command -v bash)"
            echo "             : $(bash --version | head -1)"
            echo "/bin/bash    : $(/bin/bash --version | head -1)"
            echo
            # Restated standalone so the capability claim does not rest solely
            # on reading a pass/fail out of round 1.
            probe="$(mktemp -d)/probe.sb"
            printf '(version 1)\n(allow default)\n' >"$probe"
            if sandbox-exec -f "$probe" /usr/bin/true >/dev/null 2>&1; then
              echo "seatbelt     : USABLE (sandbox_apply succeeded)"
            else
              echo "seatbelt     : CANNOT APPLY (rc=$?)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
