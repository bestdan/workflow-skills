name: CI

# Deterministic, blocking quality gate. Runs the exact same entrypoint
# (scripts/check.sh) that contributors run locally via `just check`, so CI and
# local can never drift. Behavioral evals are NOT here — they are opt-in and
# live in evals.yml (manual workflow_dispatch).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Deterministic gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          # Nothing cacheable here (the only lockfile is a uv *script* lock);
          # disabling avoids a spurious "no cache dependency matched" warning.
          enable-cache: false

      - name: Install dprint + claude CLI
        # dprint is pinned to match the local toolchain; claude provides
        # `plugin validate`. Node/npm are preinstalled on ubuntu-latest.
        run: npm install -g dprint@0.54.0 @anthropic-ai/claude-code

      - name: Install shell tools
        # Both artifacts are download-then-verify: the checksums pin the exact
        # bytes, so a retagged or tampered release fails the gate instead of
        # executing. Bump the sha alongside the version on every upgrade.
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          SHFMT_VERSION: v3.10.0
          SHFMT_SHA256: 1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJ --strip-components=1 -C /usr/local/bin \
            -f /tmp/shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"

          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      # NOTE (tracked in dev_docs/.../step_3.md): first CI run verifies whether
      # `claude plugin validate` works headless (no auth) on a GitHub runner. If
      # it requires auth, fold manifest-schema validation into scripts/validate.py
      # and drop the CLI from this gate — validate.py already covers version-sync
      # and manifest cross-consistency.
      - name: Deterministic quality gate
        run: bash scripts/check.sh

  # NOTE: a relative-link-integrity job (lychee --offline) was intentionally
  # dropped — the shipped docs (README, skills, commands, agents) contain no
  # relative markdown links to check, so it scanned 0 links and only produced a
  # vacuous/failing result. Reinstate it if inter-doc markdown links are added.
