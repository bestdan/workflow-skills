name: CI

# Deterministic, blocking quality gate. The `quality` job runs the exact same
# entrypoint (scripts/check.sh) that contributors run locally via `just check`,
# so CI and local can never drift. Behavioral evals are NOT here — they are
# opt-in and live in evals.yml (manual workflow_dispatch).
#
# The `macos` job is deliberately NOT that entrypoint — see its own comment for
# why running check.sh twice would buy nothing. It is a second HOST, not a
# second gate: the union of the two jobs is the coverage, because neither
# platform is a superset of the other.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Deterministic gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        # SHA-pinned despite this job being `contents: read`, for a tracking
        # reason rather than a security one: astral-sh stopped publishing
        # floating major tags after v7, so `@v7` is a dead end pointing at
        # v7.6.0 while upstream ships v9 -- and Dependabot cannot see past a
        # floating tag. Pinning the SHA makes it track real releases again
        # (it rewrites the SHA and the trailing version comment together).
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          # Nothing cacheable here (the only lockfile is a uv *script* lock);
          # disabling avoids a spurious "no cache dependency matched" warning.
          enable-cache: false

      - name: Install shell + format tools
        # dprint, shellcheck and shfmt all come from mise.toml, so CI and a
        # contributor's laptop resolve identical versions instead of drifting
        # between npm, tarballs and a local mise. cache: true keeps the
        # installed toolchain across runs.
        #
        # This replaced a hand-rolled curl + sha256sum block that pinned exact
        # bytes. mise's aqua backend does verify a checksum per download, but
        # against the aqua registry rather than a sha committed here, so the
        # trust root moved from this file to that registry. Commit a mise.lock
        # (`mise settings lockfile=true`) if that tradeoff stops being
        # acceptable.
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install claude CLI
        # Still npm: claude provides `plugin validate` and has no mise plugin.
        # Node/npm are preinstalled on ubuntu-latest.
        run: npm install -g @anthropic-ai/claude-code

      # NOTE (tracked in dev_docs/.../step_3.md): first CI run verifies whether
      # `claude plugin validate` works headless (no auth) on a GitHub runner. If
      # it requires auth, fold manifest-schema validation into scripts/validate.py
      # and drop the CLI from this gate — validate.py already covers version-sync
      # and manifest cross-consistency.
      - name: Deterministic quality gate
        run: bash scripts/check.sh

  macos:
    name: Host-sensitive suites (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Runs the shell/bats layer only, NOT scripts/check.sh. Everything else
      # in that script (dprint, validate.py, typecheck, the python suites) is
      # host-independent, so a second run of it would cost a mise + uv + npm
      # toolchain install on macOS to re-assert what `quality` already proved.
      # This job exists for the assertions that are host-DEPENDENT, and
      # scripts/test-shell.sh is exactly those: the bats files plus the
      # orchestrator suite. It needs only bash, git and the vendored bats
      # submodules, which is why there are no install steps above.
      #
      # SO_TEST_REQUIRE_SEATBELT=1 is the point of the job. Without it the
      # suite reports a green "N passed, 14 skipped" on a host that never
      # applied a profile, which is precisely the false comfort this job is
      # meant to remove; with it, a run is green only when ZERO
      # seatbelt-behavioral assertions were skipped. Verified reachable before
      # this job was written rather than assumed — a throwaway probe on this
      # branch (runs 31872616800 / 31872828322) confirmed macos-latest can
      # apply a profile and that the flag passes there.
      #
      # Note the flag gates on the SKIP COUNT, not on seatbelt capability, and
      # several skip sites are host-fixture ones (launchctl, plutil, distinct
      # fixture binaries). All were present on the macos26 image; a future
      # runner image that drops one would fail this job for a reason unrelated
      # to seatbelt. Read the skip reasons before assuming a regression.
      # This job is also the ONLY place the Bash 3.2 floor that AGENTS.md
      # requires is exercised — the ubuntu job runs Bash 5, and no script
      # asserts a version. That used to hold incidentally, because this image
      # happens to keep /bin/bash ahead of Homebrew's bash on PATH, so the
      # `#!/usr/bin/env bash` scripts landed on 3.2. An image that reordered
      # PATH would have retired the check silently. Invoking /bin/bash by name
      # makes it a contract instead. The pin is carried down by hand —
      # test-shell.sh to the orchestrator driver, the driver to each of its
      # seven parts, both hops via "$BASH" — because every bare `bash` on that
      # path re-resolves through PATH. SO_TEST_REQUIRE_BASH3 is what makes that
      # chain trustworthy: the suites assert on arrival, so a hop dropped by a
      # future edit fails the job instead of silently reopening the hole.
      - name: Assert /bin/bash is the 3.2 floor
        run: |
          /bin/bash -c '
            printf "%s\n" "$BASH_VERSION"
            [ "${BASH_VERSINFO[0]}" -eq 3 ] || {
              echo "::error::/bin/bash is no longer 3.2 — the Bash floor this job pins is not being exercised. Re-read dev_docs/testing.md before deciding what to do." >&2
              exit 1
            }'

      - name: Shell + bats suites, full seatbelt coverage required
        env:
          SO_TEST_REQUIRE_SEATBELT: 1
          SO_TEST_REQUIRE_BASH3: 1
        run: /bin/bash scripts/test-shell.sh

  # NOTE: a relative-link-integrity job (lychee --offline) was intentionally
  # dropped — the shipped docs (README, skills, commands, agents) contain no
  # relative markdown links to check, so it scanned 0 links and only produced a
  # vacuous/failing result. Reinstate it if inter-doc markdown links are added.
